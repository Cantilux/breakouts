<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="title desc">
  <title id="title">The breakouts grid</title>
  <desc id="desc">Seven column tracks: full, feature, popout, content, popout, feature, full. Bars show the span of .full, .feature, .popout, the default content column, .feature-start and .full-end.</desc>
  <style>
    .bg { fill: #f6f8fa; stroke: #d1d9e0; }
    .guide { stroke: #c4ccd5; stroke-dasharray: 3 4; }
    .track { fill: #59636e; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .band { fill: #eaeef2; }
    .band-content { fill: #dbe7ff; }
    .bar { fill: rgba(0, 85, 255, 0.10); stroke: #0055ff; stroke-width: 1.5; }
    .bar-content { fill: rgba(0, 85, 255, 0.22); }
    .label { fill: #0a3fbf; font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .note { fill: #59636e; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151b23; stroke: #3d444d; }
      .guide { stroke: #3d444d; }
      .track, .note { fill: #9198a1; }
      .band { fill: #212830; }
      .band-content { fill: #1b2a4a; }
      .bar { fill: rgba(122, 162, 255, 0.12); stroke: #7aa2ff; }
      .bar-content { fill: rgba(122, 162, 255, 0.26); }
      .label { fill: #c4d4ff; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="999" height="429" rx="12"/>

  <!-- Track bands: full 120, feature 90, popout 70, content 360 (not to scale) -->
  <rect class="band" x="40" y="28" width="120" height="30" rx="4"/>
  <rect class="band" x="164" y="28" width="82" height="30" rx="4"/>
  <rect class="band" x="250" y="28" width="66" height="30" rx="4"/>
  <rect class="band-content" x="320" y="28" width="360" height="30" rx="4"/>
  <rect class="band" x="684" y="28" width="66" height="30" rx="4"/>
  <rect class="band" x="754" y="28" width="82" height="30" rx="4"/>
  <rect class="band" x="840" y="28" width="120" height="30" rx="4"/>
  <g class="track" text-anchor="middle">
    <text x="100" y="48">full</text>
    <text x="205" y="48">feature</text>
    <text x="283" y="48">popout</text>
    <text x="500" y="48">content</text>
    <text x="717" y="48">popout</text>
    <text x="795" y="48">feature</text>
    <text x="900" y="48">full</text>
  </g>

  <!-- Line guides -->
  <g class="guide">
    <line x1="40" y1="66" x2="40" y2="378"/>
    <line x1="162" y1="66" x2="162" y2="378"/>
    <line x1="248" y1="66" x2="248" y2="378"/>
    <line x1="318" y1="66" x2="318" y2="378"/>
    <line x1="682" y1="66" x2="682" y2="378"/>
    <line x1="752" y1="66" x2="752" y2="378"/>
    <line x1="838" y1="66" x2="838" y2="378"/>
    <line x1="960" y1="66" x2="960" y2="378"/>
  </g>

  <!-- Spans -->
  <rect class="bar" x="40" y="80" width="920" height="36" rx="6"/>
  <text class="label" x="56" y="103">.full</text>

  <rect class="bar" x="162" y="130" width="676" height="36" rx="6"/>
  <text class="label" x="178" y="153">.feature</text>

  <rect class="bar" x="248" y="180" width="504" height="36" rx="6"/>
  <text class="label" x="264" y="203">.popout</text>

  <rect class="bar bar-content" x="318" y="230" width="364" height="36" rx="6"/>
  <text class="label" x="334" y="253">every child · .content</text>

  <rect class="bar" x="162" y="280" width="520" height="36" rx="6"/>
  <text class="label" x="178" y="303">.feature-start</text>

  <rect class="bar" x="318" y="330" width="642" height="36" rx="6"/>
  <text class="label" x="334" y="353">.full-end</text>

  <text class="note" x="40" y="408">Not to scale. Each track name also names its two lines: full-start … full-end. On a phone, popout and feature shrink to 0.</text>
</svg>
